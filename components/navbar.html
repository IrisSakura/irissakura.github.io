<a class="skip-link" href="#main-content">跳到主要内容</a>
<nav class="navbar" aria-label="主导航">
    <div class="container nav-container">
        <a href="{{homeHref}}" class="logo" aria-label="IrisSakura 首页">
            <i class="fas fa-gamepad" aria-hidden="true"></i>
            <span>Iris</span>Sakura
        </a>
        <div class="nav-menu" id="main-navigation">
            {{navLinks}}
        </div>
        <div class="nav-actions">
            <label class="theme-picker">
                <i class="fas fa-palette" aria-hidden="true"></i>
                <span class="sr-only">选择页面主题</span>
                <select
                    class="theme-select"
                    aria-label="选择页面主题"
                    data-storage-key="{{themeStorageKey}}"
                    data-default-light="{{defaultLightTheme}}"
                    data-default-dark="{{defaultDarkTheme}}"
                >
                    {{themeOptions}}
                </select>
            </label>
            <button class="mobile-toggle" type="button" aria-label="打开导航菜单" aria-expanded="false" aria-controls="main-navigation">
                <i class="fas fa-bars" aria-hidden="true"></i>
            </button>
        </div>
    </div>
</nav>
<aside
    class="bgm-player"
    data-bgm-player
    data-state="paused"
    data-storage-key="{{bgmStorageKey}}"
    data-default-volume="{{bgmDefaultVolume}}"
    data-track-title="{{bgmTitle}}"
    data-track-artist="{{bgmArtist}}"
    aria-label="背景音乐播放器"
>
    <audio data-bgm-audio preload="none"{{bgmLoopAttribute}} hidden>
        <source src="{{bgmSource}}" type="{{bgmMimeType}}">
    </audio>
    <button
        class="bgm-toggle"
        type="button"
        data-bgm-toggle
        aria-label="播放背景音乐《{{bgmTitle}}》— {{bgmArtist}}"
        aria-pressed="false"
    >
        <span class="bgm-toggle-icon" aria-hidden="true">
            <i class="fas fa-music"></i>
        </span>
        <span class="bgm-copy">
            <span class="bgm-kicker">BGM</span>
            <span class="bgm-track">{{bgmTitle}} · {{bgmArtist}}</span>
        </span>
    </button>
    <label class="bgm-volume-control">
        <i class="fas fa-volume-low" aria-hidden="true"></i>
        <span class="sr-only">背景音乐音量</span>
        <input
            class="bgm-volume"
            type="range"
            data-bgm-volume
            min="0"
            max="1"
            step="0.05"
            value="{{bgmDefaultVolume}}"
            aria-label="背景音乐音量"
        >
    </label>
    <span class="sr-only" data-bgm-status role="status" aria-live="polite"></span>
</aside>
