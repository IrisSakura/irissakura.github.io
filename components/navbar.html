<a class="skip-link" href="#main-content">跳到主要内容</a>
<nav class="navbar" aria-label="主导航">
    <div class="container nav-container">
        <a href="{{homeHref}}" class="logo" aria-label="IrisSakura 首页">
            <i class="fas fa-gamepad" aria-hidden="true"></i>
            <span>Iris</span>Sakura
        </a>
        <div class="nav-menu" id="main-navigation">
            {{navLinks}}
        </div>
        <div class="nav-actions">
            <label class="theme-picker">
                <i class="fas fa-palette" aria-hidden="true"></i>
                <span class="sr-only">选择页面主题</span>
                <select
                    class="theme-select"
                    aria-label="选择页面主题"
                    data-storage-key="{{themeStorageKey}}"
                    data-default-light="{{defaultLightTheme}}"
                    data-default-dark="{{defaultDarkTheme}}"
                >
                    {{themeOptions}}
                </select>
            </label>
            <label class="layout-picker">
                <i class="fas fa-table-columns" aria-hidden="true"></i>
                <span class="sr-only">选择页面布局</span>
                <select
                    class="layout-select"
                    aria-label="选择页面布局"
                    data-storage-key="{{layoutStorageKey}}"
                    data-default-layout="{{defaultLayout}}"
                >
                    {{layoutOptions}}
                </select>
            </label>
            <button class="mobile-toggle" type="button" aria-label="打开导航菜单" aria-expanded="false" aria-controls="main-navigation">
                <i class="fas fa-bars" aria-hidden="true"></i>
            </button>
        </div>
    </div>
</nav>
