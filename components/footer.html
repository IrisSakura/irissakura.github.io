<footer class="footer">
    <div class="container">
        <div class="footer-content">
            <div class="footer-info">
                <a href="{{homeHref}}" class="footer-logo" aria-label="IrisSakura 首页">
                    <img src="{{brandMark}}" alt="" class="brand-mark">
                    <span class="brand-wordmark" aria-hidden="true"><img src="{{masterWordmark}}" alt="" class="brand-wordmark-image"></span>
                </a>
                <p class="footer-description">做游戏，也写下创作中的问题与发现。</p>
            </div>
            <div class="footer-links">{{footerGroups}}</div>
            <div class="footer-social">
                <h2>公开入口</h2>
                <div class="social-icons">
                    {{socialLinks}}
                </div>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; <span data-current-year>2026</span> IrisSakura. 保留所有权利。</p>
            <p>BUILD · ORGANIZE · BLOOM</p>
            <div class="footer-motion-settings" data-ambient-settings hidden>
                <button type="button" class="footer-motion-toggle" role="switch" aria-label="背景动效" aria-checked="true" data-ambient-toggle>
                    <span>背景动效</span>
                    <span class="footer-motion-track" aria-hidden="true"><span></span></span>
                    <span class="footer-motion-state" data-ambient-label aria-hidden="true">开启</span>
                </button>
            </div>
        </div>
    </div>
</footer>
