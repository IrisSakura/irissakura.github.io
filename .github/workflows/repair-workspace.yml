name: Isolated Website Repair Workspace
on:
  push:
    branches: [repair/website-v2-1-20260911]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export source and installed dependencies
        run: |
          mkdir -p /tmp/website-repair
          git archive --format=tar.gz HEAD > /tmp/website-repair/source.tar.gz
          tar -czf /tmp/website-repair/node-modules.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: website-repair-workspace
          path: /tmp/website-repair
          retention-days: 1
