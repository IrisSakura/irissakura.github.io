name: Publish Framework Data To Website

on:
  push:
    branches:
      - main
    paths:
      - docs/reference/framework-inventory.generated.json
      - tools/site/generate-public-site-data.mjs
      - .github/workflows/publish-framework-site.yml
  workflow_dispatch:

concurrency:
  group: publish-framework-website
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout framework repository
        uses: actions/checkout@v4
        with:
          path: framework

      - name: Generate public framework snapshot
        working-directory: framework
        run: |
          node tools/site/generate-public-site-data.mjs \
            --input docs/reference/framework-inventory.generated.json \
            --output ../site-export/framework.json \
            --source-commit "${GITHUB_SHA}"

      - name: Checkout website repository
        uses: actions/checkout@v4
        with:
          repository: IrisSakura/irissakura.github.io
          ref: main
          path: website
          ssh-key: ${{ secrets.WEBSITE_DEPLOY_KEY }}

      - name: Copy generated data
        run: |
          mkdir -p website/data
          cp site-export/framework.json website/data/framework.json

      - name: Commit and publish changed snapshot
        working-directory: website
        run: |
          git config user.name "framework-site-publisher"
          git config user.email "framework-site-publisher@users.noreply.github.com"
          git add data/framework.json

          if git diff --cached --quiet; then
            echo "No public website changes."
            exit 0
          fi

          git commit -m "chore(framework): sync ${GITHUB_SHA::7}"
          git push origin HEAD:main
