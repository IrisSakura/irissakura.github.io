<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 112" role="img" aria-labelledby="title desc">
  <title id="title">IrisSakura 官方字标</title>
  <desc id="desc">IRIS 与 SAKURA 通过交叉符号连接的主品牌字标，适用于导航与署名。</desc>
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2575fc"/><stop offset=".48" stop-color="#6a11cb"/><stop offset="1" stop-color="#ff7eb6"/></linearGradient></defs>
  <text x="36" y="76" fill="url(#g)" font-family="Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="9">IRIS × SAKURA</text>
</svg>
