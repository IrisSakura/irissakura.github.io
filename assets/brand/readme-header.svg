<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">IrisSakura README 标题图</title>
  <desc id="desc">用于网站仓库 README 的 IrisSakura 主品牌标题图，表现工程、框架、研究与游戏验证的合流。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08111d"/><stop offset=".55" stop-color="#1b2442"/><stop offset="1" stop-color="#331d3c"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2575fc"/><stop offset=".52" stop-color="#8ce7dc"/><stop offset="1" stop-color="#ff7eb6"/></linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0V64" fill="none" stroke="#dbe7f5" stroke-opacity=".07"/></pattern>
  </defs>
  <rect width="1280" height="360" rx="42" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="42" fill="url(#grid)"/>
  <path d="M80 260h270l95-160h390l95 160h270" fill="none" stroke="url(#line)" stroke-width="4"/>
  <circle cx="350" cy="260" r="11" fill="#2575fc"/><circle cx="445" cy="100" r="11" fill="#8ce7dc"/><circle cx="835" cy="100" r="11" fill="#ff7eb6"/><circle cx="930" cy="260" r="11" fill="#8ce7dc"/>
  <text x="640" y="174" text-anchor="middle" fill="#f8fbff" font-family="Arial, sans-serif" font-size="76" font-weight="800" letter-spacing="10">IRIS × SAKURA</text>
  <text x="640" y="220" text-anchor="middle" fill="#c8d7e9" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="6">RESEARCH · ENGINEERING · FRAMEWORK · GAME</text>
</svg>
